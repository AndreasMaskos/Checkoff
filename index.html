<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#E9EAE5">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1116">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Checkoff</title>
<style>
:root {
  color-scheme: light dark;
  --bg:#E9EAE5; --panel:#F7F8F5; --fg:#14181D; --dim:#69707A; --line:#D2D6CD;
  --go:#25874E; --time:#9A6608; --over:#B23B27;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --gap: clamp(1rem, 4vw, 1.75rem);
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#0E1116; --panel:#161A21; --fg:#E8EAED; --dim:#8A93A0; --line:#262C35;
          --go:#4ADE80; --time:#E0A32E; --over:#FF6B5B; }
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 400 16px/1.5 var(--sans);
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 44rem; margin-inline: auto; padding: 0 var(--gap) 6rem; }

/* --- the mono register: numbers, labels, states --- */
.mono, .eyebrow, .num, .btn { font-family: var(--mono); }
.eyebrow { font-size: .6875rem; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }

/* --- masthead --- */
header {
  display: flex; align-items: center; gap: .75rem;
  padding: 1.25rem 0 .75rem; border-bottom: 1px solid var(--fg);
}
.wordmark { font: 800 1.0625rem/1 var(--sans); letter-spacing: -.02em; text-transform: uppercase; }
.wordmark b { color: var(--go); }
header .eyebrow { margin-left: auto; }

/* --- controls --- */
.btn {
  font-size: .75rem; letter-spacing: .08em; text-transform: uppercase;
  padding: .6rem .85rem; border: 1px solid var(--line); border-radius: 5px;
  background: var(--panel); color: var(--fg); cursor: pointer;
}
.btn:hover { border-color: var(--fg); }
.btn.go { background: var(--go); border-color: var(--go); color: var(--bg); font-weight: 700; }
.btn.quiet { background: none; border-color: transparent; color: var(--dim); padding-inline: .4rem; }
.btn.quiet:hover { color: var(--fg); }
:where(button, input, textarea, a):focus-visible { outline: 2px solid var(--go); outline-offset: 2px; }
input, textarea {
  font: 400 1rem/1.5 var(--sans); width: 100%; padding: .7rem .8rem; color: var(--fg);
  background: var(--panel); border: 1px solid var(--line); border-radius: 5px;
}
textarea { min-height: 13rem; font-family: var(--mono); font-size: .9375rem; line-height: 1.8; resize: vertical; }
label { display: block; margin-bottom: 1rem; }
label .eyebrow { display: block; margin-bottom: .35rem; }
.row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.hidden { display: none !important; }
.note { color: var(--dim); font-size: .8125rem; }
.note.bad { color: var(--over); }

/* --- home: checklist index --- */
#index { list-style: none; margin: 0; padding: 0; }
#index li { border-bottom: 1px solid var(--line); padding: .9rem 0; }
#index .title { font-size: 1.125rem; font-weight: 600; letter-spacing: -.01em; }
#index .meta { display: flex; gap: .75rem; font-size: .6875rem; letter-spacing: .1em;
               text-transform: uppercase; color: var(--dim); margin-top: .15rem; }
#index .meta .badge { color: var(--go); }
#index .acts { margin-top: .6rem; }
.empty { padding: 3rem 0; border-bottom: 1px solid var(--line); }
.empty p { margin: 0 0 .35rem; color: var(--dim); }

/* --- runner: the teleprompter --- */
#log { padding-top: .5rem; }
.line {
  display: flex; gap: .75rem; align-items: baseline; width: 100%; text-align: left;
  background: none; border: 0; border-bottom: 1px solid var(--line);
  padding: .4rem 0; color: var(--dim); font-family: var(--mono); font-size: .8125rem; cursor: pointer;
}
.line .txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.line.checked .txt { text-decoration: line-through; }
.line.checked .num { color: var(--go); }
#stage { padding: clamp(1.5rem, 6vw, 2.75rem) 0; }
#counter { display: flex; align-items: baseline; gap: .6rem; margin-bottom: .5rem; }
#challenge {
  font: 650 clamp(1.875rem, 8vw, 3.25rem)/1.08 var(--sans);
  letter-spacing: -.03em; margin: 0; text-wrap: balance;
}
#clock { font: 500 clamp(1.5rem, 5vw, 2rem)/1 var(--mono); margin-top: .75rem; color: var(--time); }
#clock.over { color: var(--over); }
#stage.fresh #challenge, #stage.fresh #clock { animation: rise .28s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
#queue .line { cursor: pointer; opacity: .55; }

/* --- action bar --- */
#bar {
  position: sticky; bottom: 0; margin-top: 1.25rem; padding: .75rem 0 max(.75rem, env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
#bar .row { gap: .4rem; }
#bar .btn.go { flex: 1; padding-block: .85rem; font-size: .8125rem; }
#mic { display: flex; align-items: center; gap: .5rem; margin-top: .6rem; min-height: 1.4rem; }
#dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--line); flex: none; }
#dot.on { background: var(--go); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
#heard { font-family: var(--mono); font-size: .75rem; color: var(--dim);
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* --- panels (sharing, auth) --- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
         padding: 1rem; margin: 1.25rem 0; }
.panel h2 { font: 600 .9375rem/1 var(--sans); margin: 0 0 .75rem; }
#linkOut { font-family: var(--mono); font-size: .8125rem; }
#auth { max-width: 24rem; margin-inline: auto; padding-top: 2.5rem; }
#auth h1 { font: 650 1.75rem/1.15 var(--sans); letter-spacing: -.03em; margin: 0 0 .4rem; }
#auth .lede { color: var(--dim); margin: 0 0 1.75rem; }
#tabs { display: flex; gap: .25rem; margin-bottom: 1.25rem; border-bottom: 1px solid var(--line); }
#tabs button { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
               padding: .5rem .1rem; margin-right: 1.25rem; color: var(--dim); cursor: pointer;
               font: .75rem/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
#tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--go); }

/* --- photo log --- */
#shotPreview :is(img, video), .entry :is(img, video) {
  display: block; width: 100%; border-radius: 5px; margin-bottom: .75rem; background: var(--bg);
}
.entry { border-bottom: 1px solid var(--line); padding: 1rem 0; }
.entry .meta { display: flex; gap: .75rem; font-size: .6875rem; letter-spacing: .1em;
               text-transform: uppercase; color: var(--dim); margin-bottom: .5rem; }
.entry .meta .when { margin-left: auto; flex: none; }
.entry p { margin: 0 0 .5rem; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

<header>
  <span class="wordmark">Check<b>off</b></span>
  <span class="eyebrow" id="who"></span>
</header>

<!-- ============ home ============ -->
<section id="home">
  <ul id="index"></ul>
  <div class="row" style="margin-top:1.25rem">
    <button class="btn go" onclick="edit(null)">New checklist</button>
    <span class="spacer"></span>
    <button class="btn quiet" id="acctBtn"></button>
  </div>
  <p class="note" id="support"></p>
</section>

<!-- ============ editor ============ -->
<section id="editor" class="hidden">
  <p class="eyebrow" style="padding-top:1.25rem">Checklist</p>
  <label>
    <span class="eyebrow">Name</span>
    <input id="title" placeholder="Morning routine">
  </label>
  <label>
    <span class="eyebrow">Steps — one per line</span>
    <textarea id="items" placeholder="Kettle on&#10;Grind beans @40s&#10;Rinse portafilter&#10;Pull shot @28s"></textarea>
  </label>
  <p class="note">Add a countdown with <code>@</code> — <code>@2m</code>, <code>@30s</code>, <code>@1:30</code>, or <code>@3</code> for minutes.</p>

  <div class="panel" id="sharePanel">
    <h2>Sharing</h2>
    <div id="shareBody"></div>
  </div>

  <div class="row">
    <button class="btn go" onclick="save()">Save</button>
    <button class="btn" onclick="renderHome()">Cancel</button>
    <span class="spacer"></span>
    <button class="btn quiet" id="removeBtn" onclick="removeList()">Delete</button>
  </div>
</section>

<!-- ============ runner ============ -->
<section id="runner" class="hidden">
  <div id="log"></div>
  <div id="stage">
    <div id="counter"><span class="eyebrow" id="stepNo"></span><span class="eyebrow" id="listName"></span></div>
    <h1 id="challenge"></h1>
    <div id="clock" class="hidden"></div>
  </div>
  <div class="panel hidden" id="shotPanel">
    <h2 id="shotStep">Log this step</h2>
    <div id="shotPreview"></div>
    <label>
      <span class="eyebrow">Description — optional</span>
      <input id="shotNote" placeholder="What this shows">
    </label>
    <div class="row">
      <button class="btn go" onclick="saveShot()">Save to log</button>
      <button class="btn" onclick="cancelShot()">Cancel</button>
      <span class="spacer"></span>
      <span class="note" id="shotMsg"></span>
    </div>
  </div>
  <div id="queue"></div>
  <div id="bar">
    <div class="row">
      <button class="btn go" onclick="mark(true)">Done</button>
      <button class="btn" onclick="mark(false)">Skip</button>
      <button class="btn" onclick="$('shot').click()">Photo/video</button>
      <input id="shot" class="hidden" type="file" accept="image/*,video/*">
      <button class="btn" onclick="move(-1)">Back</button>
      <button class="btn" onclick="undo()">Undo</button>
      <button class="btn quiet" onclick="quit()">Exit</button>
    </div>
    <div id="mic">
      <span id="dot"></span>
      <button class="btn quiet" id="micBtn" onclick="toggleMic()">Start voice</button>
      <span id="heard"></span>
    </div>
  </div>
</section>

<!-- ============ log ============ -->
<section id="logView" class="hidden">
  <p class="eyebrow" style="padding-top:1.25rem">Log</p>
  <h1 id="logTitle" style="font:650 1.75rem/1.15 var(--sans);letter-spacing:-.03em;margin:.2rem 0 1.25rem"></h1>
  <div id="logBody"></div>
  <p style="margin-top:1.5rem"><button class="btn quiet" onclick="renderHome()">← Back to my checklists</button></p>
</section>

<!-- ============ auth ============ -->
<section id="auth" class="hidden">
  <h1 id="authHead">Keep your checklists everywhere</h1>
  <p class="lede" id="authLede">One account syncs every device and lets you share a list with someone else.</p>
  <div id="tabs">
    <button id="tabIn" onclick="setMode('in')">Sign in</button>
    <button id="tabUp" onclick="setMode('up')">Create account</button>
  </div>
  <form id="authForm">
    <label>
      <span class="eyebrow">Email</span>
      <input id="authEmail" type="email" autocomplete="email" required placeholder="you@example.com">
    </label>
    <label>
      <span class="eyebrow">Password</span>
      <input id="authPass" type="password" autocomplete="current-password" required minlength="6" placeholder="At least 6 characters">
    </label>
    <div class="row">
      <button class="btn go" id="authGo" type="submit">Sign in</button>
      <button class="btn quiet" type="button" onclick="magicLink()">Email me a link instead</button>
    </div>
  </form>
  <p class="note" id="authNote" style="margin-top:1rem"></p>
</section>

</div>

<script type="module">
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
function make(tag, props, kids = []) { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; }
const button = (label, fn, cls = 'btn') => make('button', { className: cls, textContent: label, onclick: fn });

/* ================= storage =================
   One record per checklist: that is what makes per-list sync and sharing work.
   deleted:true is a tombstone so a delete propagates instead of the list coming
   back from another device on the next sync. */
let db = JSON.parse(localStorage.checkoff || '{"lists":[]}');
for (const l of db.lists) { l.id ??= crypto.randomUUID(); l.updatedAt ??= Date.now(); }
let editing = null, run = null;

const saveLocal = () => localStorage.checkoff = JSON.stringify(db);
const byId = id => db.lists.find(l => l.id === id);
const visible = () => db.lists.filter(l => !l.deleted);
const mine = l => !l.owner || l.owner === user?.id;

function touch(list) { list.updatedAt = Date.now(); saveLocal(); push([list]); }
function show(id) {
  if (sb && !user && id !== 'auth') id = 'auth';   // signing in is not optional once sync is configured
  for (const s of document.querySelectorAll('section')) s.classList.toggle('hidden', s.id !== id);
  scrollTo(0, 0);
}

/* ================= home ================= */
function renderHome() {
  const ul = $('index');
  ul.innerHTML = '';
  const lists = visible();
  if (!lists.length) {
    ul.innerHTML = '<li class="empty"><p>No checklists yet.</p>' +
      '<p class="note">Make one for something you do the same way every day — then run it hands-free.</p></li>';
  }
  for (const l of lists) {
    const total = l.items.reduce((t, s) => t + parseStep(s).secs, 0);
    const badge = !mine(l) ? '<span class="badge">shared with you</span>'
                : l.shareToken ? `<span class="badge">${l.shareMode === 'live' ? 'shared live' : 'link out'}</span>` : '';
    const li = make('li', { innerHTML:
      `<div class="title">${esc(l.title)}</div>
       <div class="meta"><span>${l.items.length} step${l.items.length === 1 ? '' : 's'}</span>` +
       (total ? `<span>${mmss(total)} timed</span>` : '') + badge + '</div>' });
    li.append(make('div', { className: 'row acts' }, [
      button('Start', () => start(l.id), 'btn go'),
      button('Edit', () => edit(l.id)),
      ...(sb ? [button('Log', () => showLog(l.id))] : []),
    ]));
    ul.append(li);
  }
  $('acctBtn').textContent = !sb ? '' : user ? 'Sign out' : 'Sign in to sync';
  $('acctBtn').classList.toggle('hidden', !sb);
  $('acctBtn').onclick = () => user ? sb.auth.signOut() : showAuth('in');
  $('who').textContent = user ? user.email : '';
  show('home');
}

/* ================= editor ================= */
function edit(id) {
  editing = id;
  const l = id === null ? { title: '', items: [] } : byId(id);
  $('title').value = l.title;
  $('items').value = l.items.join('\n');
  $('removeBtn').textContent = mine(l) ? 'Delete' : 'Leave this list';
  renderShare(l);
  show('editor');
}
function save() {
  const fields = {
    title: $('title').value.trim() || 'Untitled',
    items: $('items').value.split('\n').map(s => s.trim()).filter(Boolean),
  };
  let l;
  if (editing === null) db.lists.push(l = { id: crypto.randomUUID(), ...fields });
  else Object.assign(l = byId(editing), fields);
  touch(l);
  renderHome();
}
async function removeList() {
  const l = editing !== null && byId(editing);
  if (!l) return renderHome();
  if (!mine(l)) {
    if (!confirm('Leave this list? The owner keeps it.')) return;
    await sb.from('shares').delete().eq('list_id', l.id);
    db.lists = db.lists.filter(x => x !== l);
    saveLocal();
  } else if (confirm('Delete this checklist?')) {
    l.deleted = true;
    touch(l);
  } else return;
  renderHome();
}

/* ================= steps & timers ================= */
// "Grind beans @40s" -> { text: 'Grind beans', secs: 40 }.  Bare number = minutes.
function parseStep(line) {
  const m = line.match(/\s+@(?:(\d+):(\d{1,2})|(\d+)\s*(s|m|min)?)$/i);
  if (!m) return { text: line, secs: 0 };
  const secs = m[1] !== undefined ? +m[1] * 60 + +m[2]
             : /^s$/i.test(m[4] || '') ? +m[3]
             : +m[3] * 60;
  return { text: line.slice(0, m.index).trim(), secs };
}
const mmss = s => (s < 0 ? '-' : '') + Math.floor(Math.abs(s) / 60) + ':' + String(Math.abs(s) % 60).padStart(2, '0');
const pad2 = i => String(i).padStart(2, '0');

/* ================= runner ================= */
function start(id) {
  const list = byId(id);
  const steps = list.items.map(parseStep);
  run = { id, title: list.title, steps, at: 0, state: steps.map(() => null), times: steps.map(() => 0),
          enteredAt: Date.now(), deadline: 0, rang: false, history: [] };
  $('listName').textContent = list.title;
  renderRun();
  show('runner');
  navigator.wakeLock?.request('screen').catch(() => {});
}
function stepLine(i, cls) {
  const b = make('button', { className: `line ${cls}`, onclick: () => jump(i) });
  const done = run.state[i] !== null;
  b.innerHTML = `<span class="num">${done ? (run.state[i] ? '✓' : '–') : pad2(i + 1)}</span>` +
                `<span class="txt">${esc(run.steps[i].text)}</span>` +
                `<span class="num">${run.times[i] ? mmss(Math.round(run.times[i] / 1000))
                                     : run.steps[i].secs ? mmss(run.steps[i].secs) : ''}</span>`;
  return b;
}
function renderRun() {
  const done = [], todo = [];
  run.steps.forEach((_, i) => {
    if (run.state[i] !== null) done.push(stepLine(i, 'checked'));
    else if (i > run.at) todo.push(stepLine(i, ''));
  });
  $('log').replaceChildren(...done);
  $('queue').replaceChildren(...todo);

  const over = run.at >= run.steps.length;
  $('stepNo').textContent = over ? 'Complete' : `${pad2(run.at + 1)} / ${pad2(run.steps.length)}`;
  if (over) {
    const total = Math.round(run.times.reduce((a, b) => a + b, 0) / 1000);
    const skipped = run.state.filter(s => s === false).length;
    $('challenge').textContent = 'All done.';
    $('clock').textContent = `${mmss(total)} total` + (skipped ? ` · ${skipped} skipped` : '');
    $('clock').className = '';
  } else {
    $('challenge').textContent = run.steps[run.at].text;
    $('clock').classList.toggle('hidden', !run.deadline);
  }
  $('stage').classList.remove('fresh'); void $('stage').offsetWidth; $('stage').classList.add('fresh');
  tick();
}
function snapshot() {
  run.history.push({ at: run.at, state: [...run.state], times: [...run.times] });
  if (run.history.length > 20) run.history.shift();
}
function undo() {
  const prev = run?.history.pop();
  if (prev) { Object.assign(run, prev); enterStep(); }
}
function leaveStep() { if (run.at < run.steps.length) run.times[run.at] += Date.now() - run.enteredAt; }
function enterStep() {
  run.enteredAt = Date.now();
  run.rang = false;
  const step = run.steps[run.at];
  run.deadline = step?.secs ? Date.now() + step.secs * 1000 : 0;
  renderRun();
  speak(run.at >= run.steps.length
    ? `Checklist complete in ${Math.round(run.times.reduce((a, b) => a + b, 0) / 60000)} minutes.`
    : step.text);
}
function jump(i) { snapshot(); leaveStep(); run.at = i; enterStep(); }
function mark(done) {
  if (run.at >= run.steps.length) return;
  snapshot();
  run.state[run.at] = done;
  leaveStep();
  run.at++;
  enterStep();
}
function move(d) {
  if (d) { snapshot(); leaveStep(); run.at = Math.max(0, Math.min(run.steps.length, run.at + d)); }
  enterStep();
}
function quit() { if (listening) toggleMic(); cancelShot(); run = null; renderHome(); }

/* ================= photo log =================
   A picture or clip of what actually happened on a step, timestamped, kept per
   list. ponytail: upload goes straight out — no offline queue. Add one if
   logging from a basement without signal turns out to matter. */
let pending = null;
const MAX = 50 * 1024 * 1024;                 // our own cap, matching Supabase's free-tier per-object limit
const fit = (w, h, max = 1600) => { const s = Math.min(1, max / Math.max(w, h)); return [Math.round(w * s), Math.round(h * s)]; };
const stamp = iso => new Date(iso).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
// Videos are told apart by the file extension on the way back down — cheaper than a mime column.
const extOf = (name, type) => (name.match(/\.[a-z0-9]+$/i)?.[0] || '.' + ((type || '').split('/')[1] || 'bin')).toLowerCase();
const isClip = path => /\.(mp4|mov|m4v|webm|avi|3gp)$/i.test(path || '');
const oversize = b => `That file is ${Math.round(b.size / 1e6)} MB. Keep it under 50 MB — record a shorter clip.`;

async function shrink(file) {                 // phone photos are 4 MB; 1600px of JPEG is plenty for a log
  const img = await createImageBitmap(file);
  const [w, h] = fit(img.width, img.height);
  const c = Object.assign(document.createElement('canvas'), { width: w, height: h });
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
}

$('shot').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';                        // so the same file can be picked twice
  if (!file || !run) return;
  const clip = (file.type || '').startsWith('video/');
  const blob = clip ? file : await shrink(file);   // ponytail: no transcoding, a clip goes up as it was shot
  const over = run.at >= run.steps.length;
  pending = { list: run.id, step: run.at, text: over ? 'Checklist complete' : run.steps[run.at].text,
              blob, url: URL.createObjectURL(blob),
              ext: clip ? extOf(file.name, file.type) : '.jpg',
              type: clip ? file.type || 'video/mp4' : 'image/jpeg' };
  $('shotStep').textContent = pending.text;
  $('shotPreview').replaceChildren(clip
    ? make('video', { src: pending.url, controls: true, playsInline: true, preload: 'metadata' })
    : make('img', { src: pending.url, alt: 'About to be logged' }));
  $('shotNote').value = '';
  note($('shotMsg'), blob.size > MAX ? oversize(blob) : '', blob.size > MAX);
  $('shotPanel').classList.remove('hidden');
  $('shotNote').focus();
};
function cancelShot() {
  if (pending?.url) URL.revokeObjectURL(pending.url);
  $('shotPreview').replaceChildren();
  $('shotPanel').classList.add('hidden');
  pending = null;
}
async function saveShot() {
  if (!pending) return;
  if (!user) return note($('shotMsg'), 'Sign in to keep a log.', true);
  if (pending.blob.size > MAX) return note($('shotMsg'), oversize(pending.blob), true);
  note($('shotMsg'), 'Uploading…');
  const path = `${pending.list}/${crypto.randomUUID()}${pending.ext}`;
  const up = await sb.storage.from('logs').upload(path, pending.blob, { contentType: pending.type });
  if (up.error) return note($('shotMsg'), up.error.message, true);
  const { error } = await sb.from('log_entries').insert({
    list_id: pending.list, owner: user.id, step: pending.step, step_text: pending.text,
    note: $('shotNote').value.trim(), path,
  });
  if (error) return note($('shotMsg'), error.message, true);
  cancelShot();
}

let logList = null;
async function showLog(id) {
  logList = id;
  $('logTitle').textContent = byId(id).title;
  $('logBody').innerHTML = '<p class="note">Loading…</p>';
  show('logView');
  if (!user) return $('logBody').innerHTML = '<p class="note">Sign in to see this checklist’s log.</p>';
  const { data, error } = await sb.from('log_entries').select('*')
    .eq('list_id', id).order('created_at', { ascending: false });
  if (error) return $('logBody').innerHTML = `<p class="note bad">${esc(error.message)}</p>`;
  if (!data.length) return $('logBody').innerHTML =
    '<p class="note">Nothing logged yet. Start the checklist and tap Photo on a step.</p>';

  const paths = data.map(e => e.path).filter(Boolean);
  const { data: signed } = paths.length ? await sb.storage.from('logs').createSignedUrls(paths, 3600) : { data: [] };
  const url = Object.fromEntries((signed || []).map(s => [s.path, s.signedUrl]));
  $('logBody').replaceChildren(...data.map(e => {
    const card = make('div', { className: 'entry', innerHTML:
      `<div class="meta"><span>${pad2(e.step + 1)} · ${esc(e.step_text)}</span>` +
      `<span class="when">${esc(stamp(e.created_at))}</span></div>` +
      (url[e.path] ? isClip(e.path)
        ? `<video src="${url[e.path]}" controls playsinline preload="metadata"></video>`
        : `<img src="${url[e.path]}" alt="${esc(e.note || e.step_text)}" loading="lazy">` : '') +
      (e.note ? `<p>${esc(e.note)}</p>` : '') });
    if (e.owner === user.id) card.append(button('Delete', () => removeEntry(e), 'btn quiet'));
    return card;
  }));
}
async function removeEntry(e) {
  if (!confirm('Delete this log entry?')) return;
  if (e.path) await sb.storage.from('logs').remove([e.path]);
  await sb.from('log_entries').delete().eq('id', e.id);
  showLog(logList);
}

setInterval(tick, 1000);
function tick() {
  if (!run || !run.deadline || run.at >= run.steps.length) return;
  const left = Math.round((run.deadline - Date.now()) / 1000);
  $('clock').textContent = mmss(left);
  $('clock').className = left < 0 ? 'over' : '';
  if (left <= 0 && !run.rang) { run.rang = true; speak('Time is up.'); }
}

/* ================= voice ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const LANG = navigator.language || 'en-US';
let rec = null, listening = false, speaking = false;

// ponytail: substring match, no grammar/NLU. Add fuzzy matching only if misfires show up.
const COMMANDS = [
  ['undo',   ['undo', 'rückgängig', 'ruckgangig', 'zurücknehmen']],
  ['done',   ['done', 'check', 'chek', 'yes', 'ok', 'okay', 'complete', 'erledigt', 'fertig', 'ja', 'passt']],
  ['skip',   ['skip', 'no', 'überspringen', 'uberspringen', 'nein']],
  ['next',   ['next', 'weiter', 'nächste', 'nachste']],
  ['back',   ['back', 'previous', 'zurück', 'zuruck']],
  ['repeat', ['repeat', 'again', 'what', 'wiederhol', 'nochmal', 'was']],
  ['stop',   ['stop', 'pause', 'exit', 'halt', 'ende']],
];
function matchCommand(text) {
  const t = ' ' + text.toLowerCase().replace(/[^\p{L}\s]/gu, ' ').trim() + ' ';
  for (const [cmd, words] of COMMANDS) if (words.some(w => t.includes(' ' + w))) return cmd;
  return null;
}
const HANDLERS = { done: () => mark(true), skip: () => mark(false), next: () => move(1),
                   back: () => move(-1), repeat: () => move(0), undo, stop: () => toggleMic() };

function toggleMic() {
  if (listening) { listening = false; rec?.stop(); micUI(); return; }
  if (!SR) return alert('This browser has no speech recognition. Chrome, Edge or Safari works; Firefox does not.');
  rec = new SR();
  rec.lang = LANG;
  rec.continuous = true;
  rec.interimResults = false;
  rec.onresult = e => {
    const text = e.results[e.results.length - 1][0].transcript.trim();
    $('heard').textContent = '“' + text + '”';
    HANDLERS[matchCommand(text)]?.();
  };
  // ponytail: browsers end recognition on silence/after each phrase — just restart it.
  rec.onend = () => { if (listening && !speaking) try { rec.start() } catch {} };
  rec.onerror = e => { if (e.error === 'not-allowed') { listening = false; micUI(); $('heard').textContent = 'Microphone blocked — allow it in the address bar.'; } };
  listening = true;
  rec.start();
  micUI();
  move(0);
}
function micUI() {
  $('micBtn').textContent = listening ? 'Stop voice' : 'Start voice';
  $('dot').className = listening ? 'on' : '';
  if (!listening) $('heard').textContent = '';
}
function speak(text) {
  speechSynthesis.cancel();
  if (listening) { speaking = true; rec.stop(); }        // don't let the mic hear the app
  const u = new SpeechSynthesisUtterance(text);
  u.lang = LANG;
  u.onend = u.onerror = () => {
    speaking = false;
    if (listening) setTimeout(() => { try { rec.start() } catch {} }, 250);
  };
  speechSynthesis.speak(u);
}

/* ================= sync ================= */
import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';
let sb = null, user = null;

const toRow = l => ({ id: l.id, owner: l.owner ?? user.id, title: l.title, items: l.items,
                      share_token: l.shareToken ?? null, share_mode: l.shareMode ?? 'copy',
                      deleted: !!l.deleted, updated_at: new Date(l.updatedAt).toISOString() });
const fromRow = r => ({ id: r.id, owner: r.owner, title: r.title, items: r.items,
                        updatedAt: Date.parse(r.updated_at), deleted: r.deleted,
                        shareToken: r.share_token ?? undefined, shareMode: r.share_mode });

// ponytail: last-write-wins per list, whole-list granularity. Two people editing the
// same list at the same moment still lose one side — needs per-item merge if that bites.
function merge(local, rows, uid) {
  const seen = new Map(rows.map(r => [r.id, r]));
  // Someone else's list that the server no longer returns = access revoked or owner
  // deleted it. Our own lists are never dropped this way, so a failed push can't eat them.
  const lists = local.filter(l => !(l.owner && l.owner !== uid && !seen.has(l.id)));
  for (const r of rows) {
    const i = lists.findIndex(l => l.id === r.id);
    if (i < 0) lists.push(fromRow(r));
    else if (Date.parse(r.updated_at) > lists[i].updatedAt) lists[i] = fromRow(r);
  }
  return { lists, outbox: lists.filter(l => !(Date.parse(seen.get(l.id)?.updated_at) >= l.updatedAt)) };
}
async function push(lists) {
  if (!user || !lists.length) return;
  const { error } = await sb.from('lists').upsert(lists.map(toRow));
  if (!error) for (const l of lists) l.owner ??= user.id;
  saveLocal();
}
async function sync() {
  if (!user) { renderHome(); return showAuth('up'); }   // signed out: start on Create account
  const { data, error } = await sb.from('lists').select('*');
  if (error) return;
  const { lists, outbox } = merge(db.lists, data, user.id);
  db.lists = lists;
  saveLocal();
  await push(outbox);
  if (!run) renderHome();
}

/* ================= sharing ================= */
function renderShare(l) {
  const box = $('shareBody');
  box.replaceChildren();
  if (!user) {
    box.innerHTML = '<p class="note">Sign in to share this checklist with someone.</p>';
    box.append(button('Sign in', () => showAuth('in')));
    return;
  }
  if (editing === null) { box.innerHTML = '<p class="note">Save the checklist first, then you can share it.</p>'; return; }
  if (!mine(l)) { box.innerHTML = '<p class="note">Shared with you by someone else. Your edits are visible to everyone on the list.</p>'; return; }

  if (!l.shareToken) {
    box.innerHTML = '<p class="note">Two ways to hand this list to someone.</p>';
    box.append(make('div', { className: 'row' }, [
      button('Send a copy', () => setShare(l, 'copy')),
      button('Share live', () => setShare(l, 'live')),
    ]));
    box.append(make('p', { className: 'note', style: 'margin-top:.6rem',
      textContent: 'A copy is theirs alone and drifts apart from yours. Live means one list, both of you editing it.' }));
    return;
  }
  const url = shareUrl(l);
  box.innerHTML = `<p class="note">${l.shareMode === 'live'
    ? 'Anyone who opens this link joins <b>this</b> list and can edit it.'
    : 'Anyone who opens this link gets their own copy.'}</p>`;
  box.append(make('input', { id: 'linkOut', readOnly: true, value: url, onclick: e => e.target.select() }));
  box.append(make('div', { className: 'row', style: 'margin-top:.6rem' }, [
    button('Send link', () => sendLink(l), 'btn go'),
    button('Stop sharing', () => unshare(l)),
  ]));
}
const shareUrl = l => location.href.split('#')[0] + '#share=' + l.shareToken;

function setShare(l, mode) {
  l.shareToken ??= crypto.randomUUID();
  l.shareMode = mode;
  touch(l);
  renderShare(l);
}
async function sendLink(l) {
  const url = shareUrl(l);
  if (navigator.share) return navigator.share({ title: l.title, url }).catch(() => {});
  await navigator.clipboard?.writeText(url).catch(() => {});
  $('linkOut').select();
  note($('shareBody'), 'Link copied.');
}
function unshare(l) {
  if (!confirm('Old links stop working. People already on the list lose access. Continue?')) return;
  sb.from('shares').delete().eq('list_id', l.id);
  delete l.shareToken;
  l.shareMode = 'copy';
  touch(l);
  renderShare(l);
}
async function openShareLink(token) {
  history.replaceState(null, '', location.pathname);
  if (!sb) return alert('Sync is not configured, so share links cannot be opened.');
  const { data } = await sb.rpc('shared_list', { token });
  const row = data?.[0];
  if (!row) return alert('That link is no longer valid. Ask for a new one.');
  if (row.share_mode === 'live') {
    if (!user) { localStorage.pendingInvite = token; return showAuth('up', `Sign in to join “${row.title}”.`); }
    await sb.rpc('accept_invite', { token });
    await sync();
    return;
  }
  if (!confirm(`Add “${row.title}” (${row.items.length} steps) to your checklists?`)) return;
  const copy = { id: crypto.randomUUID(), title: row.title, items: row.items };   // fresh id, no token: independent
  db.lists.push(copy);
  touch(copy);
  renderHome();
}

/* ================= accounts ================= */
let authMode = 'in';
function showAuth(mode, message = '') {
  setMode(mode);
  note($('authNote'), message);
  show('auth');
}
function setMode(mode) {
  authMode = mode;
  const up = mode === 'up';
  $('tabIn').setAttribute('aria-selected', !up);
  $('tabUp').setAttribute('aria-selected', up);
  $('authGo').textContent = up ? 'Create account' : 'Sign in';
  $('authPass').autocomplete = up ? 'new-password' : 'current-password';
  $('authHead').textContent = up ? 'Keep your checklists everywhere' : 'Welcome back';
  $('authLede').textContent = up
    ? 'One account syncs every device and lets you share a list with someone else.'
    : 'Sign in to pull your checklists onto this device.';
}
function note(target, text, bad = false) {
  target.className = bad ? 'note bad' : 'note';
  target.textContent = text;
}
$('authForm').onsubmit = async e => {
  e.preventDefault();
  const email = $('authEmail').value.trim(), password = $('authPass').value;
  note($('authNote'), 'Working…');
  const { data, error } = authMode === 'up'
    ? await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.href.split('#')[0] } })
    : await sb.auth.signInWithPassword({ email, password });
  if (error) return note($('authNote'), error.message, true);
  if (authMode === 'up' && !data.session) {
    return note($('authNote'), data.user?.identities?.length === 0
      ? 'That email already has an account. Sign in instead.'
      : 'Almost there — open the confirmation link in your inbox.');
  }
  // onAuthStateChange takes it from here.
};
async function magicLink() {
  const email = $('authEmail').value.trim();
  if (!email) return note($('authNote'), 'Enter your email first.', true);
  note($('authNote'), 'Working…');
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.href.split('#')[0] } });
  note($('authNote'), error ? error.message : 'Check your inbox for the sign-in link.', !!error);
}

if (SUPABASE_URL && SUPABASE_ANON_KEY) {
  const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
  sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange(async (_e, session) => {
    user = session?.user ?? null;
    if (user && localStorage.pendingInvite) {
      await sb.rpc('accept_invite', { token: localStorage.pendingInvite });
      delete localStorage.pendingInvite;
    }
    sync();
  });
  addEventListener('focus', () => user && sync());
}

/* ================= boot ================= */
Object.assign(window, { $, edit, save, removeList, start, mark, move, undo, quit, toggleMic, renderHome, setMode,
                        magicLink, saveShot, cancelShot, showLog });
if (!SR) $('support').textContent = 'Voice control needs Chrome, Edge or Safari — this browser has no Web Speech API.';
setMode('up');
// Settle the session before the first paint, or every signed-in load flashes the sign-in screen.
if (sb) user = (await sb.auth.getSession()).data.session?.user ?? null;
renderHome();
navigator.serviceWorker?.register('sw.js').catch(() => {});
const invite = location.hash.match(/^#share=([0-9a-f-]{36})$/i);
if (invite) openShareLink(invite[1]);

/* ponytail: self-check for the fiddly logic. Open index.html#test, read the console. */
if (location.hash === '#test') {
  const eq = (a, b) => console.assert(JSON.stringify(a) === JSON.stringify(b), a, '!==', b);
  eq(matchCommand('Okay, done!'), 'done');
  eq(matchCommand('chek'), 'done');
  eq(matchCommand('undo that'), 'undo');
  eq(matchCommand('abandoned'), null);                       // must not match "done" mid-word
  eq(parseStep('Grind beans @40s'), { text: 'Grind beans', secs: 40 });
  eq(parseStep('Stretch @1:30'), { text: 'Stretch', secs: 90 });
  eq(parseStep('Email @work'), { text: 'Email @work', secs: 0 });
  eq(esc('<img src=x onerror=alert(1)>'), '&lt;img src=x onerror=alert(1)&gt;');
  eq(fit(4000, 3000), [1600, 1200]);                         // downscale keeps the aspect ratio
  eq(fit(3000, 4000), [1200, 1600]);
  eq(fit(800, 600), [800, 600]);                             // never upscale
  eq(extOf('IMG_0042.MOV', 'video/quicktime'), '.mov');       // extension wins, lowercased
  eq(extOf('clip', 'video/mp4'), '.mp4');                     // no extension: fall back to the mime type
  eq([isClip('x/y.mov'), isClip('x/y.jpg')], [true, false]);  // and it round-trips on the way back down
  const row = (id, t, at, owner = 'me') => ({ id, owner, title: t, items: [], deleted: false,
    share_token: null, share_mode: 'copy', updated_at: new Date(at).toISOString() });
  eq(merge([], [row('a', 'A', 10)], 'me').lists.length, 1);                       // remote arrives
  eq(merge([], [row('a', 'A', 10)], 'me').outbox.length, 0);                      // and is not echoed
  eq(merge([{ id: 'b', title: 'B', items: [], updatedAt: 5 }], [], 'me').outbox.length, 1);   // local goes up
  eq(merge([{ id: 'a', title: 'old', items: [], updatedAt: 5 }], [row('a', 'new', 10)], 'me').lists[0].title, 'new');
  eq(merge([{ id: 'a', title: 'mine', items: [], updatedAt: 20 }], [row('a', 'old', 10)], 'me').lists[0].title, 'mine');
  eq(merge([{ id: 's', owner: 'them', title: 'S', items: [], updatedAt: 5 }], [], 'me').lists.length, 0); // revoked
  eq(merge([{ id: 'k', owner: 'me', title: 'K', items: [], updatedAt: 5 }], [], 'me').lists.length, 1);   // mine kept
  console.log('self-check finished');
}
</script>
